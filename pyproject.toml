[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "social_automation.settings_test"
python_files = ["tests.py", "test_*.py"]
addopts = [
  "--strict-markers",
  "-ra",
  # Overrides DJANGO_SETTINGS_MODULE in the environment (e.g. Docker/Postgres in .env)
  "--ds=social_automation.settings_test",
  # Coverage over the whole codebase. A narrow module list here used to report 70% while
  # measuring 7.5% of the code, leaving the files that concentrate the bug fixes unmeasured.
  "--cov=apps",
  "--cov=social_automation",
  "--cov-report=term-missing:skip-covered",
  # Ratchet: this is the coverage MEASURED at bb05fb8 (R-04), not a target. Raise it
  # whenever the real number goes up; never lower it to make a red build green.
  "--cov-fail-under=42.2",
]
filterwarnings = [
  "ignore::DeprecationWarning",
]

[tool.coverage.run]
branch = true
# Test files would count as 100% covered and inflate the number (51% instead of 41%).
omit = [
  "*/tests/*",
  "*/migrations/*",
  "*/__pycache__/*",
  "conftest.py",
  "manage.py",
]

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "def __repr__",
  "raise NotImplementedError",
  "if TYPE_CHECKING:",
]
show_missing = true
skip_covered = false

[tool.ruff]
target-version = "py311"
line-length = 100
exclude = [
  ".venv",
  "venv",
  "migrations",
  "node_modules",
  "frontend/dist",
]

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "F",   # pyflakes
  "I",   # isort
  "UP",  # pyupgrade
  "B",   # flake8-bugbear
]
ignore = [
  "E501",  # line length (handled by formatter preference)
]

[tool.ruff.lint.isort]
known-first-party = ["apps", "social_automation", "config"]
